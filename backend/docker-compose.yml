services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: najda
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/najda
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json

      SUPER_ADMIN_FIREBASE_UID: ${SUPER_ADMIN_FIREBASE_UID}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      # Email verification (OTP) + SMTP
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH_HOST:-./secrets/firebase-service-account.json}:/secrets/firebase-service-account.json:ro

volumes:
  postgres_data: