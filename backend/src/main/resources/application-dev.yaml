spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/najda
    username: postgres
    password: postgres

  jpa:
    show-sql: true

najda:
  auth:
    otp:
      secret: ${OTP_HMAC_SECRET:dev-only-secret-do-not-use-in-production-0000}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE