services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: najda
      POSTGRES_USER: najda
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U najda"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/najda
      SPRING_DATASOURCE_USERNAME: najda
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - backend
    env_file: ./web/.env
    ports:
      - "3000:3000"

volumes:
  postgres_data: